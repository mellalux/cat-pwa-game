<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cat Game" />
  <title>Cat Game</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <style>
    :root {
      color-scheme: dark;
      --bg1: #06101d;
      --bg2: #102542;
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --panel: rgba(255,255,255,.10);
      --panel-border: rgba(255,255,255,.16);
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: radial-gradient(circle at 30% 20%, #163b67 0%, var(--bg2) 35%, var(--bg1) 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    .hud {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .pill, .start-card {
      color: var(--text);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border-radius: 999px;
        box-shadow: 0 16px 45px rgba(0,0,0,.20);
    }
    .pill {
      padding: 9px 13px;
      font-weight: 700;
      font-size: 15px;
      line-height: 1;
    }
    .controls {
      position: fixed;
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 11;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      color: white;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.20);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    button:active { transform: scale(.97); }
    .start {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 45%, rgba(34, 197, 94, .08), rgba(0,0,0,.48));
    }
    .start-card {
      width: min(460px, calc(100vw - 36px));
      border-radius: 28px;
      padding: 26px;
      text-align: center;
    }
    .start-card h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 7vw, 48px);
      letter-spacing: -.04em;
    }
    .start-card p {
      margin: 0 auto 18px;
      max-width: 34ch;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }
    .start-card button {
      background: linear-gradient(135deg, #22c55e, #06b6d4);
      color: #02111a;
      border: 0;
      font-size: 18px;
      padding: 14px 22px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Kassi 2D mäng"></canvas>
  <script src="sound.js"></script>

  <div class="hud">
    <div class="pill">Score: <span id="score">0</span></div>
    <div class="pill">Speed: <span id="speed">1.0×</span></div>
  </div>

  <div class="controls">
    <button id="modeBtn" type="button">Target: mouse</button>
    <button id="speedBtn" type="button">Speed +</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>

  <div id="start" class="start">
    <div class="start-card">
      <h1>🐾 Cat Game</h1>
      <p>Place your iPad on the floor or table. Tap start and let your cat catch the moving target.</p>
      <button id="startBtn" type="button">Start</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: true });
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const modeBtn = document.getElementById('modeBtn');
    const speedBtn = document.getElementById('speedBtn');
    const resetBtn = document.getElementById('resetBtn');
    const start = document.getElementById('start');
    const startBtn = document.getElementById('startBtn');

    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w = 0;
    let h = 0;
    let running = false;
    let last = 0;
    let score = 0;
    let speedLevel = 1;
    let mode = 'mouse';
    let pulse = 0;

    const pointerBursts = [];
    const stars = [];

    const target = {
      x: 200,
      y: 200,
      vx: 180,
      vy: 140,
      r: 34,
      angle: 0,
      wobble: 0,
    };

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      target.x = Math.min(Math.max(target.x, target.r), w - target.r);
      target.y = Math.min(Math.max(target.y, target.r), h - target.r);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function setScore(value) {
      score = value;
      scoreEl.textContent = String(score);
      // Kiirenda iga 10 punkti järel
      const newSpeed = 1 + Math.floor(score / 10) * 0.25;
      if (newSpeed !== speedLevel) {
        speedLevel = newSpeed;
        speedEl.textContent = speedLevel.toFixed(2).replace(/\.00$/, '.0') + '×';
        randomVelocity();
        if (typeof playSound === 'function') playSound('mode'); // lisa heliefekt kiiruse muutusele
      }
    }

    function randomVelocity() {
      const base = rand(150, 245) * speedLevel;
      const a = rand(0, Math.PI * 2);
      target.vx = Math.cos(a) * base;
      target.vy = Math.sin(a) * base;
    }

    function resetTarget() {
      target.x = rand(target.r + 20, Math.max(target.r + 21, w - target.r - 20));
      target.y = rand(target.r + 70, Math.max(target.r + 71, h - target.r - 80));
      randomVelocity();
    }

    function addBurst(x, y) {
      pointerBursts.push({ x, y, life: 0.34, max: 0.34 });
      for (let i = 0; i < 16; i++) {
        stars.push({
          x, y,
          vx: rand(-230, 230),
          vy: rand(-230, 230),
          r: rand(2, 5),
          life: rand(.35, .75),
          max: .75,
        });
      }
      if (typeof playSound === 'function') playSound('burst');
    }

    function catchTarget(x, y) {
      const dx = x - target.x;
      const dy = y - target.y;
      const distance = Math.hypot(dx, dy);
      addBurst(x, y);

      if (distance < target.r + 46) {
        setScore(score + 1);
        pulse = 1;
        target.x = Math.min(Math.max(target.x + dx * .25, target.r), w - target.r);
        target.y = Math.min(Math.max(target.y + dy * .25, target.r), h - target.r);
        randomVelocity();
        if (typeof playSound === 'function') playSound('catch_' + mode);
      }
    }

    function pointerPos(event) {
      const t = event.touches ? event.touches[0] : event;
      return { x: t.clientX, y: t.clientY };
    }

    canvas.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      catchTarget(event.clientX, event.clientY);
    }, { passive: false });

    canvas.addEventListener('pointermove', (event) => {
      if (!event.isPrimary) return;
      if (event.buttons === 1 || event.pointerType === 'touch') {
        event.preventDefault();
        const now = performance.now();
        if (!canvas._lastTrail || now - canvas._lastTrail > 60) {
          canvas._lastTrail = now;
          addBurst(event.clientX, event.clientY);
        }
      }
    }, { passive: false });

    function drawBackground(t) {
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.globalAlpha = .35;
      for (let i = 0; i < 18; i++) {
        const x = (i * 137 + t * 12) % (w + 120) - 60;
        const y = (i * 83 + Math.sin(t * .5 + i) * 30) % (h + 120) - 60;
        ctx.beginPath();
        ctx.arc(x, y, 2 + (i % 4), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.4)';
        ctx.fill();
      }
      ctx.restore();
    }

    function drawMouse() {
      ctx.save();
      ctx.translate(target.x, target.y);
      ctx.rotate(target.angle);
      const s = 1 + pulse * .35;
      ctx.scale(s, s);

      ctx.shadowColor = 'rgba(0,0,0,.35)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 10;

      ctx.beginPath();
      ctx.moveTo(18, 0);
      ctx.bezierCurveTo(4, -26, -33, -20, -38, 0);
      ctx.bezierCurveTo(-33, 20, 4, 26, 18, 0);
      ctx.fillStyle = '#cbd5e1';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(-20, -16, 10, 0, Math.PI * 2);
      ctx.arc(-20, 16, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#94a3b8';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(7, -7, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-38, 0);
      ctx.bezierCurveTo(-70, -8, -70, 25, -98, 18);
      ctx.strokeStyle = '#fda4af';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.restore();
    }

    function drawLaser() {
      const grd = ctx.createRadialGradient(target.x, target.y, 2, target.x, target.y, target.r * 2.2);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(.18, 'rgba(248,113,113,.98)');
      grd.addColorStop(.55, 'rgba(239,68,68,.38)');
      grd.addColorStop(1, 'rgba(239,68,68,0)');
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(target.x, target.y, target.r * (1.45 + pulse * .3), 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.restore();
    }

    function drawFeather() {
      ctx.save();
      ctx.translate(target.x, target.y);
      ctx.rotate(target.angle + Math.sin(target.wobble) * .35);
      const s = 1 + pulse * .18;
      ctx.scale(s, s);
      ctx.shadowColor = 'rgba(0,0,0,.35)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 10;

      const colors = ['#22c55e', '#06b6d4', '#facc15', '#fb7185'];
      for (let i = 0; i < 4; i++) {
        ctx.rotate((Math.PI * 2) / 4);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(18, -16, 54, -16, 70, 0);
        ctx.bezierCurveTo(48, 12, 18, 16, 0, 0);
        ctx.fillStyle = colors[i];
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.fillStyle = '#fff7ed';
      ctx.fill();
      ctx.restore();
    }

    function drawTarget() {
      if (mode === 'mouse') drawMouse();
      if (mode === 'laser') drawLaser();
      if (mode === 'feather') drawFeather();
    }

    function drawEffects(dt) {
      for (let i = pointerBursts.length - 1; i >= 0; i--) {
        const b = pointerBursts[i];
        b.life -= dt;
        const p = 1 - b.life / b.max;
        ctx.save();
        ctx.globalAlpha = Math.max(0, b.life / b.max);
        ctx.beginPath();
        ctx.arc(b.x, b.y, 18 + p * 70, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,.8)';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();
        if (b.life <= 0) pointerBursts.splice(i, 1);
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        s.life -= dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += 260 * dt;
        ctx.save();
        ctx.globalAlpha = Math.max(0, s.life / s.max);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.fill();
        ctx.restore();
        if (s.life <= 0) stars.splice(i, 1);
      }
    }

    function update(dt) {
      const wobble = Math.sin(performance.now() * .002) * 26;
      target.x += (target.vx + wobble) * dt;
      target.y += (target.vy + Math.cos(performance.now() * .0017) * 22) * dt;
      target.angle = Math.atan2(target.vy, target.vx);
      target.wobble += dt * 6;

      const marginTop = 52;
      const marginBottom = 72;
      if (target.x < target.r) { target.x = target.r; target.vx = Math.abs(target.vx); }
      if (target.x > w - target.r) { target.x = w - target.r; target.vx = -Math.abs(target.vx); }
      if (target.y < target.r + marginTop) { target.y = target.r + marginTop; target.vy = Math.abs(target.vy); }
      if (target.y > h - target.r - marginBottom) { target.y = h - target.r - marginBottom; target.vy = -Math.abs(target.vy); }

      // Vahel muudab suunda, et kassil oleks huvitavam.
      if (Math.random() < dt * .55) {
        target.vx += rand(-80, 80) * speedLevel;
        target.vy += rand(-80, 80) * speedLevel;
        const max = 330 * speedLevel;
        const len = Math.hypot(target.vx, target.vy) || 1;
        if (len > max) {
          target.vx = target.vx / len * max;
          target.vy = target.vy / len * max;
        }
      }

      pulse = Math.max(0, pulse - dt * 3.3);
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min(.033, (now - last) / 1000 || .016);
      last = now;
      const t = now / 1000;
      update(dt);
      drawBackground(t);
      drawTarget();
      drawEffects(dt);
      requestAnimationFrame(loop);
    }

    function startGame() {
      start.classList.add('hidden');
      running = true;
      last = performance.now();
      resetTarget();
      requestAnimationFrame(loop);
      if (typeof playSound === 'function') playSound('start');
    }

    startBtn.addEventListener('click', startGame);

    modeBtn.addEventListener('click', () => {
      const modes = ['mouse', 'laser', 'feather'];
      mode = modes[(modes.indexOf(mode) + 1) % modes.length];
      const label = mode === 'mouse' ? 'mouse' : mode === 'laser' ? 'laser' : 'feather';
      modeBtn.textContent = 'Target: ' + label;
      target.r = mode === 'laser' ? 26 : mode === 'feather' ? 38 : 34;
      if (typeof playSound === 'function') playSound('mode');
    });

    speedBtn.addEventListener('click', () => {
      speedLevel = speedLevel >= 2 ? 0.75 : +(speedLevel + .25).toFixed(2);
      speedEl.textContent = speedLevel.toFixed(2).replace(/\.00$/, '.0') + '×';
      randomVelocity();
    });

    resetBtn.addEventListener('click', () => {
      setScore(0);
      resetTarget();
    });

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 250));

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      last = performance.now();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    resize();
    resetTarget();
    drawBackground(0);
    drawTarget();
  </script>
</body>
</html>
