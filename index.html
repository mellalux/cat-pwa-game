<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cat Game" />
  <title>Cat Game</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="images/icon-192.svg" />
  <link rel="icon" href="images/icon-192.svg" />
  <meta name="description" content="Place your iPad on the floor or table. Tap start and let your cat catch the moving target." />
  <meta name="keywords" content="cat, game, iPad, PWA, interactive" />
  <meta name="author" content="Meelis Luks a.k.a Mella" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://home.lux.ee/tomsgame/" />
    <meta property="og:title" content="Cat Game" />
    <meta property="og:description" content="Place your iPad on the floor or table. Tap start and let your cat catch the moving target." />
    <meta property="og:image" content="https://home.lux.ee/tomsgame/images/icon-512.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://home.lux.ee/tomsgame/" />
    <meta name="twitter:title" content="Cat Game" />
    <meta name="twitter:description" content="Place your iPad on the floor or table. Tap start and let your cat catch the moving target." />
    <meta name="twitter:image" content="https://home.lux.ee/tomsgame/images/icon-512.svg" />
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="preload" as="script" href="js/sound.js">
    <script src="js/sound.js" defer></script>
</head>
<body>
  <canvas id="game" aria-label="Kassi 2D mäng"></canvas>

  <div class="hud">
    <div class="pill">Score: <span id="score">0</span></div>
    <div class="pill">Speed: <span id="speed">1.0×</span></div>
  </div>

  <div class="controls">
    <button id="modeBtn" type="button">Target: mouse</button>
    <button id="speedBtn" type="button">Speed +</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>

  <div id="start" class="start">
    <div class="start-card">
      <h1>Cat Game</h1>
      <span class="emoji">🐾</span>
      <p>Place your iPad on the floor or table. Tap start and let your cat catch the moving target.</p>
      <button id="startBtn" type="button">Start</button>
      <p class="author">Created by <a href="https://www.mella.ee" target="_blank" rel="noopener noreferrer">Meelis Luks a.k.a Mella</a> 2026</p>
    </div>
  </div>

  <script src="js/main.js" defer></script>
</body>
</html>
